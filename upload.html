<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StatLearn AI - Upload Material</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="dashboard.html">

            🤖 StatLearn AI

        </a>

        <a
            class="btn btn-light"
            href="dashboard.html">

            Dashboard

        </a>

    </div>

</nav>



<div class="container mt-5">


    <div class="upload-card">


        <h2>
            📄 Upload Learning Material
        </h2>


        <p class="text-muted">

            Upload your learning material and
            generate MCQs using AI.

        </p>



        <div class="upload-box">


            <div class="upload-icon">
                📁
            </div>


            <h5>
                Select Learning Material
            </h5>


            <p>
                PDF, DOCX or TXT
            </p>


            <input
                type="file"
                id="material"
                class="form-control"
                accept=".pdf,.doc,.docx,.txt">


        </div>



        <button
            class="btn btn-primary mt-4"
            onclick="generateMCQs()">

            🤖 Generate MCQs

        </button>



        <div id="uploadResult"
             class="mt-4">
        </div>


    </div>


</div>


<script src="script.js"></script>

</body>

</html>
