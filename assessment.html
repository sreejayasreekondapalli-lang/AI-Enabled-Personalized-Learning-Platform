<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skill Assessment</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            🤖 StatLearn AI
        </a>

        <a class="btn btn-light"
           href="dashboard.html">
            Dashboard
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="assessment-header">

        <h2>📝 AI Skill Assessment</h2>

        <p>
            Answer the following questions to identify
            your competency gaps.
        </p>

    </div>


    <div class="question-card">

        <h5>
            Question 1 of 5
        </h5>

        <hr>

        <h4>
            Which measure represents the middle value
            of an ordered dataset?
        </h4>


        <div class="form-check answer-option">

            <input
                class="form-check-input"
                type="radio"
                name="q1"
                value="Mean">

            <label class="form-check-label">
                Mean
            </label>

        </div>


        <div class="form-check answer-option">

            <input
                class="form-check-input"
                type="radio"
                name="q1"
                value="Median">

            <label class="form-check-label">
                Median
            </label>

        </div>


        <div class="form-check answer-option">

            <input
                class="form-check-input"
                type="radio"
                name="q1"
                value="Mode">

            <label class="form-check-label">
                Mode
            </label>

        </div>


        <div class="form-check answer-option">

            <input
                class="form-check-input"
                type="radio"
                name="q1"
                value="Range">

            <label class="form-check-label">
                Range
            </label>

        </div>


        <button
            class="btn btn-primary mt-4"
            onclick="submitQuiz()">

            Submit Assessment

        </button>

    </div>


    <div id="quizResult"></div>

</div>


<script src="script.js"></script>

</body>
</html>
